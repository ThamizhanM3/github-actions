name: pipeline-12-Cache

on: push

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: cache-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install